<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72">
  <defs>
    <linearGradient id="vkonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="vkonSubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="vkonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Vector Icon: Geometric Precision Chevron V -->
  <g transform="translate(10, 10)">
    <!-- Main Left Arm of V -->
    <path d="M4 6 L22 46 L34 46 L16 6 Z" fill="url(#vkonGrad)" filter="url(#vkonGlow)"/>
    <!-- Dynamic Forward Accent of V -->
    <path d="M26 6 L44 46 L54 46 L36 6 Z" fill="url(#vkonSubGrad)"/>
    <!-- Connecting Precision Pivot -->
    <circle cx="22" cy="46" r="3" fill="#ffffff"/>
  </g>

  <!-- Brand Typography: VKON -->
  <g transform="translate(76, 46)">
    <!-- V -->
    <path d="M0 -34 L12 -34 L21 -5 L30 -34 L42 -34 L28 0 L14 0 Z" fill="#ffffff"/>
    <!-- K -->
    <path d="M49 -34 L60 -34 L60 -18 L76 -34 L91 -34 L72 -14 L93 0 L77 0 L60 -11 L60 0 L49 0 Z" fill="#ffffff"/>
    <!-- O -->
    <path d="M117 -35 C130 -35 139 -25 139 -17 C139 -9 130 1 117 1 C104 1 95 -9 95 -17 C95 -25 104 -35 117 -35 Z M117 -26 C110 -26 106 -21 106 -17 C106 -13 110 -8 117 -8 C124 -8 128 -13 128 -17 C128 -21 124 -26 117 -26 Z" fill="#ffffff"/>
    <!-- N -->
    <path d="M147 -34 L158 -34 L180 -8 L180 -34 L191 -34 L191 0 L180 0 L158 -26 L158 0 L147 0 Z" fill="#ffffff"/>
  </g>

  <!-- Sub-wordmark: AUTOMATION -->
  <text x="80" y="60" font-family="'IBM Plex Mono', 'Inter', monospace" font-size="8.5" font-weight="600" fill="#f97316" letter-spacing="4.5">AUTOMATION</text>
</svg>
